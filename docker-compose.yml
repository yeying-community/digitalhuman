version: "3.9"
services:
  digitalhub:
    build: { context: ./digitalhub_service, dockerfile: Dockerfile }
    container_name: digitalhub
    restart: unless-stopped
    env_file: [.env]
    environment:
      VTUBER_CONF_TEMPLATE: /app/conf-base.yaml
    ports: ["9009:9009"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./conf.prod.yaml:/app/conf-base.yaml:ro
    depends_on: [gateway]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9009/api/v1/dh/ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [dhnet]

  gateway:
    build: ./gateway
    container_name: dh_vtuber_gateway
    restart: unless-stopped
    env_file: [.env]
    ports: ["12393:8080"]
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [dhnet]

  vtuber-image:
    build: { context: ./3rdparty/Open-LLM-VTuber, dockerfile: dockerfile }
    image: dh-vtuber:latest
    profiles: ["images"]

  llm-image:
    build: { context: ./digitalhuman_round_server, dockerfile: Dockerfile }
    image: dh-llm-round:latest
    profiles: ["images"]

networks:
  dhnet:
    external: true
    name: dhnet
